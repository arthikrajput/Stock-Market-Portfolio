<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="futuristic-container">
        <div class="form-wrapper">
            <form action="register.php" method="POST">
                <h1 class="form-title">Create Account</h1>
                <p class="form-subtitle">Sign up to get started</p>
                <input type="text" name="username" class="form-input" placeholder="Username" required>
                <input type="email" name="email" class="form-input" placeholder="Email" required>
                <input type="password" name="password" class="form-input" placeholder="Password" required>
                <div class="role-selection">
                    <label>
                        <input type="radio" name="role" value="guest" checked> Guest
                    </label>
                    <label>
                        <input type="radio" name="role" value="admin"> Admin
                    </label>
                </div>
                <button type="submit" class="form-button">Register</button>
                <p class="form-link">Already have an account? <a href="login.html">Login now</a></p>
            </form>
        </div>
    </div>
</body>
</html>
